<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>식약처 의료기기 품목허가 검색 (Rev 8.0)</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; background: #f4f6f9; padding: 20px; margin: 0; color: #333; }
    .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { color: #2c3e50; font-size: 22px; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
    .search-box { display: flex; gap: 10px; margin: 20px 0; }
    input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; }
    button { padding: 12px 25px; background: #3498db; color: white; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; font-weight: bold; }
    button:hover { background: #2980b9; }
    
    #status { font-weight: bold; color: #e67e22; margin: 15px 0; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
    th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    th { background-color: #ecf0f1; color: #2c3e50; }
    tbody tr:hover { background-color: #f1f9fe; cursor: pointer; }

    /* 상세 모달 */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 30px; border-radius: 8px; width: 80%; max-width: 700px; max-height: 80vh; overflow-y: auto; }
    .close-btn { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; float: right; font-weight: bold; }
    .detail-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; }
    .detail-table th { width: 30%; background: #f8f9fa; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🏥 식약처 의료기기 품목허가 통합 검색</h1>
    <p>업체명을 입력하면 목록을 조회하고, 항목을 클릭하면 상세 정보를 확인할 수 있습니다.</p>
    
    <div class="search-box">
      <input type="text" id="keyword" placeholder="예: 삼성 (또는 삼성메디슨)" value="삼성">
      <button onclick="searchCompany()">검색하기</button>
    </div>

    <div id="status"></div>

    <div id="result-area"></div>
  </div>

  <!-- 상세 정보 모달 -->
  <div id="detailModal" class="modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">닫기</button>
      <h2 id="modalTitle" style="margin-top:0; color:#2c3e50;">상세 정보</h2>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    const API_KEY = '098da3673de823360ff33e80761e71e43429732d41fa932b68265be812843028';
    let currentItems = []; // 검색된 전체 데이터 저장용

    async function searchCompany() {
      const keyword = document.getElementById('keyword').value.trim();
      const statusEl = document.getElementById('status');
      const resultArea = document.getElementById('result-area');

      if (!keyword) {
        alert('검색어를 입력해주세요.');
        return;
      }

      statusEl.innerText = '식약처 서버와 통신 중입니다...';
      resultArea.innerHTML = '';

      // 1. 목록조회 API 엔드포인트 구성 (entpNm 파라미터 사용)
      const targetUrl = `https://apis.data.go.kr/1471000/MdlpPrdlstPrmisnInfoService05/getMdlpPrdlstPrmisnList04?serviceKey=${API_KEY}&pageNo=1&numOfRows=50&type=json&entpNm=${encodeURIComponent(keyword)}`;
      const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

      try {
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error('네트워크 응답이 올바르지 않습니다. (HTTP ' + response.status + ')');

        const textData = await response.text();
        const json = JSON.parse(textData);
        
        console.log("식약처 API 원본 응답:", json);

        // 2. 데이터 구조 안전 추출 (body.items.item 파싱)
        const body = json?.response?.body || json?.body;
        const itemsWrapper = body?.items;
        
        if (!itemsWrapper) {
          statusEl.innerText = '⚠️ 검색 결과가 없거나 데이터 구조를 찾을 수 없습니다.';
          return;
        }

        const rawItem = itemsWrapper.item || itemsWrapper;
        currentItems = Array.isArray(rawItem) ? rawItem : [rawItem];

        if (currentItems.length === 0) {
          statusEl.innerText = '⚠️ 조건에 맞는 허가 정보가 없습니다.';
          return;
        }

        statusEl.innerText = `✨ 검색 성공! 총 ${currentItems.length}건의 데이터가 조회되었습니다. (아래 목록 중 하나를 클릭하세요)`;
        renderTable(currentItems);

      } catch (err) {
        console.error(err);
        statusEl.innerText = '❌ 오류 발생: ' + err.message;
      }
    }

    function renderTable(items) {
      let html = `
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>업체명</th>
              <th>품목명</th>
              <th>품목허가번호</th>
              <th>등급</th>
              <th>허가일자</th>
            </tr>
          </thead>
          <tbody>
      `;

      items.forEach((item, idx) => {
        html += `
          <tr onclick="showDetail(${idx})">
            <td>${idx + 1}</td>
            <td>${item.ENTP_NM || item.BSSH_NM || '-'}</td>
            <td>${item.PRDT_NM || '-'}</td>
            <td>${item.MEDDEV_ITEM_NO || '-'}</td>
            <td>${item.GRADE || '-'}</td>
            <td>${item.PRMISN_YMD || '-'}</td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      document.getElementById('result-area').innerHTML = html;
    }

    // 목록 중 하나를 클릭했을 때 상세조회 API를 호출하거나 기존 데이터를 팝업으로 띄움
    async function showDetail(idx) {
      const item = currentItems[idx];
      const itemNo = item.MEDDEV_ITEM_NO;
      
      document.getElementById('modalTitle').innerText = `[상세] ${item.PRDT_NM || '의료기기 상세 정보'}`;
      
      let bodyHtml = `
        <table class="detail-table">
          <tr><th>업체명</th><td>${item.ENTP_NM || item.BSSH_NM || '-'}</td></tr>
          <tr><th>품목명</th><td>${item.PRDT_NM || '-'}</td></tr>
          <tr><th>품목허가번호</th><td>${item.MEDDEV_ITEM_NO || '-'}</td></tr>
          <tr><th>등급</th><td>${item.GRADE || '-'}</td></tr>
          <tr><th>허가일자</th><td>${item.PRMISN_YMD || '-'}</td></tr>
          <tr><th>사용목적</th><td>${item.USE_PURPS || '-'}</td></tr>
          <tr><th>품목유형코드명</th><td>${item.PRDT_TYP_CD_NM || '-'}</td></tr>
          <tr><th>제조방법</th><td>${item.MNFT_MTHD || '-'}</td></tr>
          <tr><th>취소취하구분명</th><td>${item.CANCEL_WDRAW_DIVS_CD_NM || '-'}</td></tr>
          <tr><th>취소취하일자</th><td>${item.CANCEL_WDRAW_YMD || '-'}</td></tr>
        </table>
      `;

      // 만약 세부 상세조회 API(/getMdlpPrdlstPrmisnItem04)를 직접 한 번 더 찌르고 싶다면 여기서 호출 가능합니다.
      document.getElementById('modalBody').innerHTML = bodyHtml;
      document.getElementById('detailModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('detailModal').style.display = 'none';
    }
  </script>
</body>
</html>
