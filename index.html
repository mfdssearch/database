<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API 단일 테스트: 품목정보 상세설명</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; background-color: #f8f9fa; padding: 20px; color: #333; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1 { font-size: 20px; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
    .search-box { display: flex; gap: 10px; margin: 20px 0; }
    input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; }
    button { padding: 12px 25px; background: #3498db; color: white; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; font-weight: bold; }
    button:hover { background: #2980b9; }
    .status { margin: 15px 0; font-weight: bold; color: #e74c3c; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #f2f6f8; width: 35%; color: #2c3e50; }
    td { white-space: pre-wrap; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    function ApiTester() {
      const [licenseNo, setLicenseNo] = useState('');
      const [result, setResult] = useState(null);
      const [status, setStatus] = useState('');

      const API_KEY = '098da3673de823360ff33e80761e71e43429732d41fa932b68265be812843028';

      const handleSearch = async (e) => {
        e.preventDefault();
        if (!licenseNo.trim()) return alert('의료기기품목허가번호를 입력하세요.');

        setStatus('식약처 서버에 데이터를 요청 중입니다...');
        setResult(null);

        try {
          const encNo = encodeURIComponent(licenseNo.trim());
          
          // 파라미터 대소문자 문제 방지를 위해 prmisnNo와 PRMISN_NO를 둘 다 던짐
          // 캐시 방지(_t) 적용 완료
          const query = `serviceKey=${API_KEY}&pageNo=1&numOfRows=10&type=json&prmisnNo=${encNo}&PRMISN_NO=${encNo}&_t=${Date.now()}`;
          const targetUrl = `https://apis.data.go.kr/1471000/MdeqPrdlstInfoService02/getMdeqPrdlstInfoInq02?${query}`;
          const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

          const response = await fetch(proxyUrl);
          if (!response.ok) throw new Error('서버 통신 실패');
          
          const text = await response.text();
          const data = JSON.parse(text);

          const items = data?.body?.items;
          const itemList = Array.isArray(items) ? items : (items ? [items] : []);

          if (itemList.length > 0) {
            setResult(itemList[0]); // 첫 번째 검색 결과 저장
            setStatus(`검색 완료! (결과 ${itemList.length}건 중 첫번째 표시)`);
          } else {
            setStatus('⚠️ 해당 허가번호로 등록된 상세 정보가 없습니다.');
          }

        } catch (error) {
          console.error(error);
          setStatus('❌ 오류 발생: ' + error.message + ' (F12를 눌러 콘솔을 확인하세요)');
        }
      };

      // 화면에 출력할 18개 항목 리스트 (Key - Title 형태)
      const fieldList = [
        { key: 'PRMISN_NO', title: '의료기기품목허가번호' },
        { key: 'MEDDEV_ITEM_NO', title: '의료기기품목일련번호' },
        { key: 'PRDT_NM', title: '품목명' },
        { key: 'BRND_NM', title: '상품명' },
        { key: 'INDUTY_CD_NM', title: '업종' },
        { key: 'INSTT_RGN_DIVS', title: '기관지역구분' },
        { key: 'PRMISN_RPT_DIVS', title: '허가신고구분' },
        { key: 'PRMISN_YMD', title: '허가일자' },
        { key: 'DIM_INFO', title: '치수' },
        { key: 'CHRCT_NM', title: '특성명' },
        { key: 'MNFT_MTHD', title: '제조방법' },
        { key: 'USE_PURPS', title: '사용목적' },
        { key: 'USE_MTHD', title: '사용방법' },
        { key: 'USE_ATNT_MATR', title: '주의사항' },
        { key: 'VLD_PRD', title: '유효기간' },
        { key: 'TEST_STDR', title: '시험규격' },
        { key: 'CANCEL_WDRAW_DIVS_CD', title: '취소취하구분코드' },
        { key: 'CANCEL_WDRAW_YMD', title: '취소취하일자' }
      ];

      return (
        <div className="container">
          <h1>🛠️ 단일 API 테스트: 품목정보 상세설명 (MdeqPrdlstInfoService02)</h1>
          <p>식약처 서버가 '품목허가번호'를 어떻게 인식하고 응답하는지 검증합니다.</p>
          
          <form className="search-box" onSubmit={handleSearch}>
            <input 
              type="text" 
              value={licenseNo} 
              onChange={(e) => setLicenseNo(e.target.value)} 
              placeholder="예: 수허21-123, 제허11-1234호 등 정확한 번호 입력" 
            />
            <button type="submit">테스트 요청</button>
          </form>

          <div className="status">{status}</div>

          {result && (
            <table>
              <thead>
                <tr>
                  <th>항목명 (API Key)</th>
                  <th>실제 응답 데이터</th>
                </tr>
              </thead>
              <tbody>
                {fieldList.map(field => (
                  <tr key={field.key}>
                    <td><strong>{field.title}</strong><br/><span style={{fontSize: '11px', color: '#7f8c8d'}}>{field.key}</span></td>
                    <td>{result[field.key] || '-'}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ApiTester />);
  </script>
</body>
</html>
